name: Push handler

on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      run-tests:
        description: Run the automated test suites for this build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  pages:
    name: Read GitHub Pages URL
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      url: ${{ steps.pages.outputs.base_url }}/
    steps:
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
  firmware_pipeline:
    name: Build Firmware
    permissions:
      contents: read
    uses: ./.github/workflows/build_firmware.yml
    with:
      publish-builder: false
      run-tests: ${{ github.ref != 'refs/heads/develop' || inputs.run-tests == true }}
      browser-tests: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run-tests == true) }}
  client_pipeline:
    name: Build and test clients
    permissions:
      contents: read
    uses: ./.github/workflows/build_client.yml
    with:
      run-tests: ${{ github.ref != 'refs/heads/develop' || inputs.run-tests == true }}
  create_dev_release:
    permissions:
      contents: write
    name: Create dev pre-release with artifacts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    needs:
      - pages
      - firmware_pipeline
      - client_pipeline
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release-artifacts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install signature verifier
        run: python -m pip install cryptography==43.0.3
      - name: Package versioned downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 resource/tools/development.py --artifacts release-artifacts --output release-packages --commit "$GITHUB_SHA"
      - name: Upload to dev release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            Latest development build from `develop`. This version may be unstable.

            Download the archive for your computer and follow `INSTALL.txt` to install or update.

            [Bluetooth app](${{ needs.pages.outputs.url }}dev/)

            Choose Development in the USB firmware update page to install this build.

            **Firmware & resources:** standalone firmware, HEX images and web resources.
          tag_name: dev
          name: Development release
          draft: false
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: release-packages/*
      - name: Verify uploads and remove superseded downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 resource/tools/sync_release_assets.py --tag dev --archives release-packages --development
      - name: Fix up release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true
  create_release:
    permissions:
      contents: write
    name: Create tagged release with artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - firmware_pipeline
      - client_pipeline
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release-artifacts
      - name: Package versioned downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 resource/tools/package_release.py --artifacts release-artifacts --output release-packages --tag "$RELEASE_TAG"
      - name: Write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$RELEASE_TAG" '/^## / { if (found) exit; found = ($2 == tag) } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat .github/release-description.txt >> release-notes.md
      - name: Upload to tagged release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          name: Release ${{ github.ref_name }}
          draft: false
          target_commitish: ${{ github.sha }}
          files: release-packages/*
      - name: Verify uploads and remove superseded downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 resource/tools/sync_release_assets.py --tag "$RELEASE_TAG" --archives release-packages

  deploy_pages:
    name: Deploy matching resources and firmware catalogue
    needs: [create_dev_release, create_release]
    if: always() && (needs.create_dev_release.result == 'success' || needs.create_release.result == 'success')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/mirror_firmware.yml
